# ------------------------------------------------------------------------------
# REMOTE MANAGEMENT
# ------------------------------------------------------------------------------
remote_management:
  description: Apple Remote Desktop, Screen Sharing, Remote Management MDM
  apps:
    # Safe to remove: Screen Sharing.app is the Utilities screen-sharing client. Verified via otool -L: links only public frameworks (AppKit, Foundation, Contacts, ScreenSharing.framework, etc.). No kept binary (loginwindow, Dock, Finder, SystemUIServer, ControlCenter, rapportd) links this app or depends on it. ScreenSharing.framework stays on disk.
    - System/Applications/Utilities/Screen Sharing.app
  helpers: []
  xpc: []
  prefpanes: []
  appex: []
  mdimporters: []
  loctables: []
  frameworks:
    # Safe to remove: RemoteManagement.framework hosts the remotemanagementd and RemoteManagementAgent binaries. Verified via otool -L on loginwindow, Dock, Finder, SystemUIServer, ControlCenter, rapportd, secd, launchd: none link RemoteManagement.framework. Only consumers are remotemanagementd and RemoteManagementAgent (both being removed in this feature). Confirmed via rg scan of all LaunchDaemon/LaunchAgent plists: no kept plist references com.apple.remotemanagementd MachServices.
    - System/Library/PrivateFrameworks/RemoteManagement.framework
  kexts: []
  input_methods: []
  coreservices:
    # Safe to remove: ARDAgent.app is the Apple Remote Desktop agent. Verified via otool -L: links libpcre2, login.framework, Cocoa, DiskManagement.framework, CoreUtils.framework, and standard public frameworks — all self-contained to the ARD stack. No kept binary depends on ARDAgent.
    - System/Library/CoreServices/RemoteManagement/ARDAgent.app
    # Safe to remove: Remote Desktop Message.app displays ARD messages sent from an admin console. Verified via otool -L: links only Foundation, Cocoa, AppKit, SystemConfiguration, CoreFoundation, libobjc, libSystem. No kept binary depends on it.
    - System/Library/CoreServices/RemoteManagement/Remote Desktop Message.app
    # Safe to remove: SSMenuAgent.app is the Screen Sharing menu bar extra. Verified via otool -L: links ScreenSharing.framework (private, stays on disk), Contacts.framework, ContactsUI.framework, AppKit, Foundation, Security — all public or framework-stays-on-disk. No kept binary depends on SSMenuAgent itself.
    - System/Library/CoreServices/RemoteManagement/SSMenuAgent.app
  assets: []
  launchagent_plists: []
  launchdaemon_plists: []
  agents:
    # Safe to remove: screensharing.agent is the user-session screen sharing acceptor (ScreensharingAgent.bundle). Verified via plutil -p: demand-launched on com.apple.screensharing.agent.launchd notification and WatchPaths /private/etc/com.apple.screensharing.agent.launchd; sole MachService is com.apple.screensharing.agent. No kept daemon or LaunchAgent plist connects to com.apple.screensharing.agent outside this feature.
    - screensharing.agent
    # Safe to remove: screensharing.menuextra is the Screen Sharing menu bar extra agent (SSMenuAgent.app). Verified via plutil -p: demand-launched on com.apple.screensharing.menuextra notification; sole MachService is com.apple.screensharing.menuextra. No kept daemon connects to com.apple.screensharing.menuextra.
    - screensharing.menuextra
    # Safe to remove: RemoteManagementAgent is the user-session MDM remote management agent (RemoteManagement.framework/RemoteManagementAgent). Verified via plutil -p: MachServices are com.apple.RemoteManagementAgent, com.apple.RemoteManagementAgent.store, com.apple.aps.remotemanagementd.http.apns-dev/prod — all MDM/APNS-specific. RemoteManagement.framework (being removed) hosts the binary. No kept binary uses these MachServices.
    - RemoteManagementAgent
    # Safe to remove: ssinvitationagent is the Screen Sharing invitation broker (ScreensharingAgent.bundle/SSInvitationAgent.app). Verified via plutil -p: launched on com.apple.screensharing.idslaunchnotification; MachServices are com.apple.screensharing.ShareScreenInvitation and com.apple.screensharing.ViewInvitation. This label is also listed as active in the continuity feature (line 1315), which already ensures it is disabled; this entry is a consistent duplicate. No kept binary outside the screen-sharing stack depends on these MachServices.
    - ssinvitationagent
  daemons:
    # Safe to remove: com.apple.remotemanagementd is the system-level MDM remote management daemon (RemoteManagement.framework/remotemanagementd). Verified via plutil -p: MachServices are com.apple.remotemanagementd, com.apple.remotemanagementd.store, com.apple.aps.remotemanagementd.http.apns-dev/prod — all MDM/APNS-specific. RemoteManagement.framework (being removed) hosts the binary. No kept system daemon connects to these MachServices. Confirmed via rg scan of all LaunchDaemon plists.
    - com.apple.remotemanagementd
    # Safe to remove: com.apple.RemoteDesktop.PrivilegeProxy runs VNCPrivilegeProxy (AppleVNCServer.bundle/VNCPrivilegeProxy). Verified via plutil -p: sole MachService is com.apple.RemoteDesktop.PrivilegeProxy. Verified via otool -L on VNCPrivilegeProxy: links only Foundation, Kerberos, CoreFoundation, libobjc, libSystem. The sole consumer is ARDAgent.app (being removed). No kept daemon connects to com.apple.RemoteDesktop.PrivilegeProxy.
    - com.apple.RemoteDesktop.PrivilegeProxy
    # Safe to remove: com.apple.remotepairtool runs RemotePairTool (/System/Library/CoreServices/RemotePairTool). Verified via plutil -p: sole MachService is com.apple.RemotePairTool. Verified via otool -L: links only Security.framework, Foundation, CoreFoundation, libobjc, libSystem. No kept daemon plist references com.apple.RemotePairTool outside this feature. Confirmed via rg scan of all LaunchDaemon/LaunchAgent plists.
    - com.apple.remotepairtool
    # Safe to remove: com.apple.screensharing runs screensharingd.bundle (VNC server). Verified via plutil -p: already Disabled=true in its own plist — it never activates unless explicitly enabled via System Settings. MachService is com.apple.screensharing.server (HideUntilCheckIn). No kept daemon references com.apple.screensharing.server outside this feature. Disabling is a no-op on a system where VNC was never enabled.
    - com.apple.screensharing
  pluginkit: []
  user_containers: []
  user_prefs:
    # Safe to remove: com.apple.ScreenSharing is the Screen Sharing app preference plist. Screen Sharing.app is being removed. No kept binary reads this preference domain.
    - com.apple.ScreenSharing
    # Safe to remove: com.apple.RemoteDesktop is the Apple Remote Desktop preference plist. ARDAgent.app is being removed. No kept binary reads this preference domain.
    - com.apple.RemoteDesktop
  user_caches: []
