    path: System/Library/ExtensionKit/Extensions/SecurityPrivacyExtension.appex/Contents/Resources/SectionServiceList.plist
    action: rewrite
    backup: /tmp/_sectionlist_original.plist

  finder_menubar_nib:
    path: System/Library/CoreServices/Finder.app/Contents/Resources/Base.lproj/MenuBar.nib
    action: binary_patch
    replacements:
      - from: "cmdGoToICloud:"
        to:   "cmdGoToICloud_"
      - from: "cmdGoToDataSeparatedICloud:"
        to:   "cmdGoToDataSeparatedICloud_"
    constraint: same_file_size

