# ------------------------------------------------------------------------------
# MESSAGES & FACETIME
# ControlCenter links IMCore.framework — framework stays, backing processes removed.
# ------------------------------------------------------------------------------
messages_facetime:
  description: iMessage, SMS relay, FaceTime video/audio calling
  apps:
    # Safe to remove: Messages.app is the iMessage/SMS client. No kept system binary depends on it.
    - System/Applications/Messages.app
    # Safe to remove: FaceTime.app is the video/audio calling client. No kept system binary depends on it.
    - System/Applications/FaceTime.app
  helpers:
    # Safe to remove: IMAutomaticHistoryDeletionAgent.app is the iMessage auto-delete helper embedded in IMDPersistence.framework (being removed). No kept binary depends on it.
    - System/Library/PrivateFrameworks/IMDPersistence.framework/IMAutomaticHistoryDeletionAgent.app
    # Safe to remove: IMTransferAgent.app is the iMessage file-transfer helper embedded in IMTransferServices.framework (being removed). No kept binary depends on it.
    - System/Library/PrivateFrameworks/IMTransferServices.framework/IMTransferAgent.app
  xpc: []
  prefpanes: []
  appex:
    # Safe to remove: MessagesAnalyticsWorker.appex is an analytics upload worker for Messages. Verified at /System/Library/ExtensionKit/Extensions/MessagesAnalyticsWorker.appex. No kept binary depends on it.
    - MessagesAnalyticsWorker.appex
    # Safe to remove: FaceTimeNotificationExtension.appex handles FaceTime push notification display. Verified at /System/Library/ExtensionKit/Extensions/FaceTimeNotificationExtension.appex. No kept binary depends on it.
    - FaceTimeNotificationExtension.appex
    # Safe to remove: ChallengesMessageExtension.appex is also listed in the game_center feature. Both game_center and messages_facetime are being removed. No kept binary depends on it.
    - ChallengesMessageExtension.appex
  mdimporters: []
  loctables:
    # Safe to remove: FaceTime.loctable provides ControlCenter UI strings for the FaceTime module. ControlCenter links IMCore.framework (stays on disk per manifest header), not this loctable file. Removing it only disables the FaceTime tile label in ControlCenter.
    - FaceTime.loctable
  frameworks:
    # Safe to remove: IMDPersistence.framework provides iMessage chat history persistence. Verified via broad otool scan of /System/Library, /usr/libexec, /usr/lib: all hard-linkers (iMessage.imservice, SMS.imservice, imagent, etc.) are within the iMessage/FaceTime stack being removed. No kept binary outside that stack hard-links it.
    - System/Library/PrivateFrameworks/IMDPersistence.framework
    # Safe to remove: IMTransferServices.framework provides iMessage file/attachment transfer. Verified via broad otool scan: only linked by iMessage stack binaries, all of which are being removed.
    - System/Library/PrivateFrameworks/IMTransferServices.framework
    # CRITICAL: IMFoundation.framework is hard-linked (no weak flag) by rapportd (/usr/libexec/rapportd), which is kept in the continuity feature (com.apple.rapportd). Verified via otool -L /usr/libexec/rapportd: IMFoundation listed without weak flag. Removing this framework causes dyld to fail resolving rapportd's load commands at boot → rapportd crashes → AirDrop, Handoff, Universal Clipboard, and Universal Control all stop working. The debloat.sh verify scan does not catch this: rapportd is not in the KEPT_BINARIES list (debloat.sh line ~545).
    # - System/Library/PrivateFrameworks/IMFoundation.framework
    # Safe to remove: FaceTimeMessageStore.framework stores FaceTime video message metadata. Verified via plutil -p: the facetimemessagestored binary lives inside this framework and is being removed. No kept binary outside the FaceTime stack hard-links it.
    - System/Library/PrivateFrameworks/FaceTimeMessageStore.framework
    # Safe to remove: CallHistory.framework stores call log records. Verified via broad otool scan: only linked by callhistoryd, CallHistorySyncHelper, CallHistoryPluginHelper, and telephony stack binaries — all being removed. bookassetd (Books) hard-links it but bookassetd is in notes_books (also being removed).
    - System/Library/PrivateFrameworks/CallHistory.framework
    # Safe to remove: CallHistoryToolKit.framework provides UI toolkit for call history display. Only linked by the telephony/FaceTime stack (all being removed). No kept binary links it.
    - System/Library/PrivateFrameworks/CallHistoryToolKit.framework
    # Safe to remove: CallIntelligence.framework provides on-device call transcription/labelling. Verified via plutil -p: callintelligenced (its sole daemon) is being removed. No kept binary outside the call stack links it.
    - System/Library/PrivateFrameworks/CallIntelligence.framework
    # Safe to remove: TelephonyMessagingKit.framework is the public telephony messaging API. Only linked by the telephony/FaceTime stack (all being removed). No kept binary links it.
    #- System/Library/Frameworks/TelephonyMessagingKit.framework
    # Safe to remove: InstantMessage.framework is the public iMessage/Bonjour IM API. Verified via broad otool scan: all hard-linkers (iMessage.imservice, FaceTime.imservice, MessagesDataclassOwner.bundle, etc.) are within the iMessage/accounts stack being removed in this manifest.
    - System/Library/Frameworks/InstantMessage.framework
    # NOT Safe to remove: CoreTelephony.framework provides cellular/telephony primitives on Mac. Verified via broad otool scan: nearbyd hard-links it but nearbyd is disabled as com.apple.nearbyd in the continuity feature (also being removed). All other hard-linkers (identityservicesd, itunescloudd, bookassetd, assistantd) are in features being removed. Kept binaries only weak-link CoreTelephony (weak flag confirmed via otool).
    # - System/Library/Frameworks/CoreTelephony.framework
    # CRITICAL: CallKit.framework is hard-linked (no weak flag) by mediaremoted and mediaremoteagent (/System/Library/PrivateFrameworks/MediaRemote.framework/Support/), verified via otool -L and nm showing CXCall/CXCallObserver ObjC class imports. The mediaremoteagent LaunchAgent plist (com.apple.mediaremoteagent) has a LaunchEvent on com.apple.callkit.callcontroller.shouldconnect (verified via plutil -p). Removing this framework causes dyld to fail resolving MediaRemote binaries at boot → hardware media keys (play/pause, volume, Now Playing) stop working. Neither mediaremoted nor mediaremoteagent are in the debloat.sh KEPT_BINARIES verify scan (debloat.sh line ~545).
    # - System/Library/Frameworks/CallKit.framework
    # Safe to remove: LiveCommunicationKit.framework is the public VoIP/live communication API. Verified via broad otool scan: only hard-linked by VoIP stack binaries (LiveCommunication*.xpc, telephony stack) — all being removed. No kept binary outside that stack hard-links it.
    - System/Library/Frameworks/LiveCommunicationKit.framework
  kexts: []
  input_methods: []
  coreservices: []
  assets: []
  launchagent_plists:
    # Safe to remove: com.apple.facetimemessagestored plist file on SSV. Its daemon is being disabled. Verified: plist exists at /System/Library/LaunchAgents/com.apple.facetimemessagestored.plist.
    - com.apple.facetimemessagestored
    # Safe to remove: com.apple.screensharing.MessagesAgent plist file on SSV. Its binary (AppleVNCServer) is in the remote_management feature, which is also being removed (screensharing.agent, line ~1487). Verified: plist exists at /System/Library/LaunchAgents/com.apple.screensharing.MessagesAgent.plist.
    - com.apple.screensharing.MessagesAgent
  launchdaemon_plists: []
  agents:
    # Safe to remove: imagent is the iMessage delivery agent (IMCore.framework/imagent.app). Verified via plutil -p: MachServices are com.apple.imagent.*, com.apple.madrid-idswake, com.apple.corespotlight.daemon.messages — all iMessage-specific.
    - imagent
    # Safe to remove: imautomatichistorydeletionagent deletes old iMessage history. Verified via plutil -p: binary at IMDPersistence.framework/IMAutomaticHistoryDeletionAgent.app (being removed). MachService is com.apple.imautomatichistorydeletionagent.
    - imautomatichistorydeletionagent
    # Safe to remove: facetimemessagestored stores FaceTime video messages. Verified via plutil -p: binary at FaceTimeMessageStore.framework/facetimemessagestored (framework being removed); MachServices are com.apple.facetimemessagestored.* — FaceTime-specific.
    - facetimemessagestored
    # Safe to remove: securemessagingagent handles end-to-end encrypted iMessage key registration. Verified via plutil -p: binary at SecureMessaging.framework/SecureMessagingAgent; MachServices are com.apple.securemessagingagent.* — iMessage-specific.
    - securemessagingagent
    # Safe to remove: identityservicesd is the IDS (Identity Services) daemon routing iMessage/FaceTime delivery. Verified via plutil -p: binary at IDS.framework/identityservicesd.app; MachServices are com.apple.identityservicesd.* — IDS/iMessage-specific. SetupAssistantPlugins/IdentityServices.icdplugin links IMFoundation but IMFoundation is being kept (CRITICAL comment above).
    - identityservicesd
    # Safe to remove: screensharing.MessagesAgent is the AppleVNCServer instance registered for Messages screen sharing. Verified via plutil -p: binary is /System/Library/CoreServices/RemoteManagement/AppleVNCServer.bundle/Contents/MacOS/AppleVNCServer, which is part of remote_management (also being removed). Sole MachService is com.apple.screensharing.MessagesAgent.
    - screensharing.MessagesAgent
    # Safe to remove: telephonyutilities.callservicesd is the CallKit call controller host. Verified via plutil -p: binary at TelephonyUtilities.framework/callservicesd; MachServices are com.apple.callkit.* and com.apple.telephonyutilities.*. With CallKit.framework kept (CRITICAL above), these MachServices simply go unanswered — no kept binary blocks on them.
    - telephonyutilities.callservicesd
    # Safe to remove: callhistoryd maintains the call history database. Verified via plutil -p: binary at CallHistory.framework/Support/callhistoryd (framework being removed); MachServices are com.apple.callhistoryd.service and com.apple.conversation.history.
    - callhistoryd
    # Safe to remove: callintelligenced provides on-device call transcription. Verified via plutil -p: binary at CallIntelligence.framework/callintelligenced (framework being removed); sole MachService is com.apple.callintelligenced.service.
    - callintelligenced
    # Safe to remove: CallHistorySyncHelper syncs call history to iCloud via IDS. Verified via plutil -p: binary at CallHistory.framework/Support/CallHistorySyncHelper (framework being removed); MachServices are com.apple.CallHistorySyncHelper and com.apple.CallHistorySyncHelper.aps.
    - CallHistorySyncHelper
    # Safe to remove: CallHistoryPluginHelper is a plugin host for call history extensions. Verified via plutil -p: binary at CallHistory.framework/Support/CallHistoryPluginHelper (framework being removed); sole MachService is com.apple.CallHistoryPluginHelper.
    - CallHistoryPluginHelper
  daemons: []
  pluginkit:
    - com.apple.FaceTime.FaceTimeNotificationExtension
    - com.apple.poirot.MessagesAnalyticsWorker
  user_containers:
    # Safe to remove: com.apple.Messages is the Messages.app sandbox container (app being removed).
    - com.apple.Messages
    # Safe to remove: com.apple.FaceTime is the FaceTime.app sandbox container (app being removed).
    - com.apple.FaceTime
    # Safe to remove: com.apple.iChat is the legacy iChat/Messages container (app being removed).
    - com.apple.iChat
  user_group_containers:
    # Safe to remove: group.com.apple.telephonyutilities.callservicesd is the shared group container for the CallKit call services daemon (being removed).
    - group.com.apple.telephonyutilities.callservicesd
  user_prefs:
    # Safe to remove: com.apple.Messages stores Messages app preferences (app being removed).
    - com.apple.Messages
    # Safe to remove: com.apple.iChat stores legacy iChat preferences (app being removed).
    - com.apple.iChat
    # Safe to remove: com.apple.FaceTime stores FaceTime app preferences (app being removed).
    - com.apple.FaceTime
    # Safe to remove: com.apple.imservice.aim stores AIM/iMessage service preferences. Only used by imagent (being removed).
    - com.apple.imservice.aim
  user_caches:
    # Safe to remove: com.apple.Messages is the Messages app cache directory (app being removed).
    - com.apple.Messages
    # Safe to remove: com.apple.FaceTime is the FaceTime app cache directory (app being removed).
    - com.apple.FaceTime

