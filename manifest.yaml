# ------------------------------------------------------------------------------
# INTEL / AMD DEAD CODE (Apple Silicon only — kexts never load)
# All kexts below have IOKitPersonalities that only match Intel/AMD hardware.
# Verified via kmutil showloaded on Apple Silicon: none of these kexts are loaded.
# Removing them from SSV eliminates dead code without affecting system operation.
# ------------------------------------------------------------------------------
intel_amd_dead_code:
  description: Rosetta 2, Intel GPU kexts/bundles, AMD GPU kexts/bundles, x86 daemons
  apps: []
  helpers: []
  xpc: []
  prefpanes: []
  appex: []
  mdimporters: []
  loctables: []
  frameworks: []
  kexts:
    # Safe to remove: Intel CFL (Coffee Lake) graphics framebuffer driver. IOKit matches Intel integrated GPU hardware only. Never loads on Apple Silicon (AGX GPU used instead).
    - System/Library/Extensions/AppleIntelCFLGraphicsFramebuffer.kext
    # Safe to remove: Intel ICL (Ice Lake) graphics driver. Intel-only hardware match. Never loads on Apple Silicon.
    - System/Library/Extensions/AppleIntelICLGraphics.kext
    # Safe to remove: Intel ICL Low-Power graphics framebuffer. Intel-only hardware match.
    - System/Library/Extensions/AppleIntelICLLPGraphicsFramebuffer.kext
    # Safe to remove: Intel KBL (Kaby Lake) graphics driver. Intel-only hardware match.
    - System/Library/Extensions/AppleIntelKBLGraphics.kext
    # Safe to remove: Intel KBL graphics framebuffer. Intel-only hardware match.
    - System/Library/Extensions/AppleIntelKBLGraphicsFramebuffer.kext
    # Safe to remove: Intel LPSS DMA Controller. Intel Low-Power Subsystem DMA engine. No Intel chipset on Apple Silicon.
    - System/Library/Extensions/AppleIntelLpssDmac.kext
    # Safe to remove: Intel LPSS GSPI (General SPI) controller. Intel chipset only.
    - System/Library/Extensions/AppleIntelLpssGspi.kext
    # Safe to remove: Intel LPSS I2C controller. Intel chipset only.
    - System/Library/Extensions/AppleIntelLpssI2C.kext
    # Safe to remove: Intel LPSS I2C Controller driver. Intel chipset only.
    - System/Library/Extensions/AppleIntelLpssI2CController.kext
    # Safe to remove: Intel LPSS SPI Controller. Intel chipset only.
    - System/Library/Extensions/AppleIntelLpssSpiController.kext
    # Safe to remove: Intel LPSS UART common code. Intel chipset only.
    - System/Library/Extensions/AppleIntelLpssUARTCommon.kext
    # Safe to remove: Intel LPSS UART v0 driver. Intel chipset only.
    - System/Library/Extensions/AppleIntelLpssUARTv0.kext
    # Safe to remove: Intel LPSS UART v1 driver. Intel chipset only.
    - System/Library/Extensions/AppleIntelLpssUARTv1.kext
    # Safe to remove: Intel MCE (Machine Check Exception) reporter. Intel CPU error reporting. Apple Silicon uses different error handling.
    - System/Library/Extensions/AppleIntelMCEReporter.kext
    # Safe to remove: Intel PCH (Platform Controller Hub) Power Management. Intel chipset only.
    - System/Library/Extensions/AppleIntelPCHPMC.kext
    # Safe to remove: Intel Slow Adaptive Clocking. Intel CPU power management feature. Not applicable to Apple Silicon.
    - System/Library/Extensions/AppleIntelSlowAdaptiveClocking.kext
    # Safe to remove: AMD Radeon 10000-series (Navi 10) GPU controller. Discrete AMD GPU only. uses Apple GPU (AGXAcceleratorG17X verified via ioreg).
    - System/Library/Extensions/AMD10000Controller.kext
    # Safe to remove: AMD Radeon 9500-series GPU controller. Discrete AMD GPU only.
    - System/Library/Extensions/AMD9500Controller.kext
    # Safe to remove: AMD Framebuffer driver. Discrete AMD GPU only.
    - System/Library/Extensions/AMDFramebuffer.kext
    # Safe to remove: AMD Radeon Service Manager. Discrete AMD GPU only.
    - System/Library/Extensions/AMDRadeonServiceManager.kext
    # Safe to remove: AMD Radeon X4000 (Polaris) driver. Discrete AMD GPU only.
    - System/Library/Extensions/AMDRadeonX4000.kext
    # Safe to remove: AMD Radeon X4000 Hardware Services. Discrete AMD GPU only.
    - System/Library/Extensions/AMDRadeonX4000HWServices.kext
    # Safe to remove: AMD Radeon X5000 (Vega) driver. Discrete AMD GPU only.
    - System/Library/Extensions/AMDRadeonX5000.kext
    # Safe to remove: AMD Radeon X5000 Hardware Services. Discrete AMD GPU only.
    - System/Library/Extensions/AMDRadeonX5000HWServices.kext
    # Safe to remove: AMD Radeon X6000 (RDNA2) driver. Discrete AMD GPU only.
    - System/Library/Extensions/AMDRadeonX6000.kext
    # Safe to remove: AMD Radeon X6000 Framebuffer. Discrete AMD GPU only.
    - System/Library/Extensions/AMDRadeonX6000Framebuffer.kext
    # Safe to remove: AMD Radeon X6000 Hardware Services. Discrete AMD GPU only.
    - System/Library/Extensions/AMDRadeonX6000HWServices.kext
    # Safe to remove: AMD Support kext (shared AMD GPU code). Discrete AMD GPU only.
    - System/Library/Extensions/AMDSupport.kext
  input_methods: []
  coreservices:
    # Safe to remove: Rosetta 2 Updater.app checks for and installs Rosetta runtime updates. User confirmed no Intel apps needed; Rosetta runtime is also being removed.
    - System/Library/CoreServices/Rosetta 2 Updater.app
    # Safe to remove: Rosetta.flplugin is a Setup Assistant plugin that prompts to install Rosetta during first-run setup. Not needed if Rosetta not used.
    - System/Library/CoreServices/SetupAssistantPlugins/Rosetta.flplugin
  assets: []
  ssv_extra_paths:
    # Safe to remove: Rosetta runtime directory. Contains oahd, oahd-helper, translate_tool, and the x86->ARM translation engine. User confirmed no Intel apps needed.
    - usr/libexec/rosetta
    # Safe to remove: ucupdate is Intel CPU microcode update utility. Has LimitLoadToHardware.optional.x86_64: 1 in its LaunchDaemon plist, meaning it never executes on Apple Silicon. Verified via plutil -p /System/Library/LaunchDaemons/com.apple.ucupdate.plist.
    - usr/libexec/ucupdate
    # Safe to remove: displaypolicyd manages Intel display configuration policies. Has LimitLoadToHardware.optional.x86_64: 1 in its LaunchDaemon plist, preventing execution on Apple Silicon. Verified via plutil -p /System/Library/LaunchDaemons/com.apple.displaypolicyd.plist.
    - usr/libexec/displaypolicyd
    # Safe to remove: DumpGPURestart is triggered by IOAccelGPURestartReport and IOGPURestartReport IOKit events, which are Intel/AMD GPU specific. Apple Silicon GPUs (AGX) use different internal reporting via IOReport channels (GPU Restart Count). Verified via ioreg: AGXAcceleratorG17X present, IOAccelGPURestartReport absent.
    - System/Library/Frameworks/OpenGL.framework/Versions/A/Libraries/DumpGPURestart
    # Safe to remove: ReportGPURestart is user-agent counterpart to DumpGPURestart for Intel/AMD GPU crash reporting. Already disabled by default (Disabled: true in its LaunchAgent plist). Apple Silicon uses different crash reporting path.
    - System/Library/Frameworks/OpenGL.framework/Versions/A/Libraries/ReportGPURestart
  launchagent_plists: []
  launchdaemon_plists: []
  agents:
    # Safe to remove: ReportGPURestart agent is already disabled (Disabled: true in plist) and only handles Intel/AMD GPU restart events. Verified via plutil -p /System/Library/LaunchAgents/com.apple.ReportGPURestart.plist.
    - ReportGPURestart
  daemons:
    # Safe to remove: oahd is the Rosetta 2 helper daemon providing com.apple.oahd Mach service for x86 translation. With Rosetta runtime removed and user confirming no Intel apps needed, this daemon performs no useful work.
    - com.apple.oahd
    # Safe to remove: ucupdate daemon updates Intel CPU microcode. Its plist has LimitLoadToHardware.optional.x86_64: 1, so it never runs on Apple Silicon. Verified via plutil -p.
    - com.apple.ucupdate
    # Safe to remove: displaypolicyd daemon manages Intel display policies. Its plist has LimitLoadToHardware.optional.x86_64: 1, so it never runs on Apple Silicon. Verified via plutil -p.
    - com.apple.displaypolicyd
    # Safe to remove: DumpGPURestart daemon is triggered by IOKit events IOGPURestartReport and IOAccelGPURestartReport, which are Intel/AMD GPU specific. Apple Silicon uses AGXAccelerator which has different crash reporting. Verified via plutil -p LaunchDaemon plist and ioreg showing AGXAcceleratorG17X but no IOAccelGPURestartReport.
    - com.apple.DumpGPURestart
  pluginkit: []
  user_containers: []
  user_prefs: []
  user_caches: []

