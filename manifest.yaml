# ------------------------------------------------------------------------------
# MISC REMOVED APPS: Dictionary, Font Book, Stickies, TextEdit, Tips, VoiceMemos,
#   Freeform, Journal, Image Playground, QuickTime Player, App Store (Utilities),
#   AirPort Utility, Boot Camp Assistant, Grapher, Migration Assistant, Script Editor
# ------------------------------------------------------------------------------
misc_apps:
  description: Miscellaneous removed apps without large standalone feature stacks
  apps:
    # Safe to remove: Chess.app is the built-in chess game. No kept system binary depends on it.
    - System/Applications/Chess.app
    # Safe to remove: Phone.app provides Continuity Calling (iPhone relay). continuity feature removes
    # the relevant daemons. No kept system binary depends on Phone.app itself.
    - System/Applications/Phone.app
    # Safe to remove: Dictionary.app is a standalone dictionary lookup app. No kept system binary depends on it; com_apple_MobileAsset_DictionaryServices_dictionary3macOS is its sole asset and is also being removed.
    #- System/Applications/Dictionary.app
    # Safe to remove: Font Book.app is the font management UI. No kept binary depends on it; font rendering itself is handled by Core Text (stays on disk, not in removal list).
    #- System/Applications/Font Book.app
    # Safe to remove: Stickies.app is a standalone desktop note app. stickersd (being disabled) provides com.apple.stickers.api for emoji sticker packs used by Messages (also being removed). No kept binary depends on Stickies.app directly.
    - System/Applications/Stickies.app
    # Safe to remove: TextEdit.app is a standalone text editor. No kept system binary depends on it.
    - System/Applications/TextEdit.app
    # Safe to remove: Tips.app is the macOS tutorial app. Its daemon (tipsd) and TipsSpotlightHandler.app are also being removed. No kept binary depends on it.
    - System/Applications/Tips.app
    # Safe to remove: VoiceMemos.app is a standalone audio recorder. voicememod (being disabled) provides com.apple.voicememod.xpc for iCloud sync; no kept binary depends on this XPC service.
    - System/Applications/VoiceMemos.app
    # Safe to remove: Freeform.app is Apple's collaborative whiteboard app. No kept system binary depends on it.
    - System/Applications/Freeform.app
    # Safe to remove: Journal.app is Apple's journaling app. No kept system binary depends on it.
    - System/Applications/Journal.app
    # Safe to remove: Image Playground.app is Apple Intelligence image generation UI. The underlying GenerativeExperiencesRuntime.framework and PrivateCloudCompute.framework are being removed in siri_and_intelligence. No kept binary depends on it.
    - System/Applications/Image Playground.app
    # Safe to remove: QuickTime Player.app is a standalone media player. AVFoundation (stays) provides playback APIs independently; no kept system binary depends on QuickTime Player.app itself.
    - System/Applications/QuickTime Player.app
    # Safe to remove: AirPort Utility.app manages Apple AirPort base stations, which are discontinued hardware. No kept system binary depends on it. AirPortBaseStationAgent (disabled in misc_daemons) is the only related agent.
    #- System/Applications/Utilities/AirPort Utility.app
    # Safe to remove: Boot Camp Assistant is for installing Windows on Intel Macs. This system is Apple Silicon (M5 Max) — Boot Camp is never used and the assistant does nothing on ARM. No kept binary depends on it.
    - System/Applications/Utilities/Boot Camp Assistant.app
    # Safe to remove: Grapher.app is a standalone graphing calculator. No kept system binary depends on it.
    - System/Applications/Utilities/Grapher.app
    # Safe to remove: Migration Assistant.app provides data migration during macOS setup. Its daemons (systemmigrationd, migrationhelper) are demand-launched only when Migration Assistant.app itself is opened or a QueueDirectory entry appears; no kept system binary holds a standing reference to com.apple.installandsetup.systemmigrationd.* MachServices. Verified via plutil -p: QueueDirectories trigger is /Library/SystemMigration/Queue only.
    - System/Applications/Utilities/Migration Assistant.app
    # Safe to remove: Script Editor.app is an AppleScript IDE. No kept system binary depends on it; the osascript interpreter (stays in /usr/bin) does not link Script Editor.
    - System/Applications/Utilities/Script Editor.app
  helpers: []
  xpc: []
  prefpanes:
    # Safe to remove: DigiHubDiscs.prefPane is the System Settings pane for configuring disc insertion behaviour (CD/DVD autoplay). DVD Player.app is being removed. No kept system binary holds a reference to this pane.
    - DigiHubDiscs.prefPane
    # Safe to remove: PrintAndFax.prefPane is the legacy (pre-Ventura) System Preferences pane for printers. On macOS Tahoe the active pane is the System Settings extension (PrinterScannerSettings.appex, also being removed). No kept system binary depends on this legacy pane.
    - PrintAndFax.prefPane
    # Safe to remove: PrintAndScan.prefPane is the current System Settings pane for Printers & Scanners. Its companion agent (printtool.agent) and daemon (org.cups.cupsd) are both being disabled. No kept system binary depends on this pane.
    #- PrintAndScan.prefPane
    # CRITICAL: Speech.prefPane is a DUPLICATE entry — it is already listed and being removed in the siri_and_intelligence feature (line 67). Removing it twice is harmless in terms of idempotency, but flagged here so the executor does not error on a missing path after the first removal pass.
    #- Speech.prefPane
  appex:
    # Safe to remove: CDs & DVDs Settings Extension.appex is the ExtensionKit settings extension for disc insertion behaviour. DVD Player.app and DigiHubDiscs.prefPane are both being removed. Verified present at /System/Library/ExtensionKit/Extensions/CDs & DVDs Settings Extension.appex. No kept binary depends on it.
    - CDs & DVDs Settings Extension.appex
    # Safe to remove: PrinterScannerSettings.appex is the System Settings extension for printer/scanner configuration. Its backing daemons (org.cups.cupsd, com.apple.printtool.daemon) and agents (printtool.agent, printuitool.agent) are all being disabled. Verified present at /System/Library/ExtensionKit/Extensions/PrinterScannerSettings.appex. No kept binary depends on it.
    #- PrinterScannerSettings.appex
    # Safe to remove: PrinterScannerIntentsExtension.appex is the App Intents extension for printer/scanner Siri shortcuts. All printing stack components are being removed. Verified present at /System/Library/ExtensionKit/Extensions/PrinterScannerIntentsExtension.appex. No kept binary depends on it.
    #- PrinterScannerIntentsExtension.appex
  mdimporters:
    # Safe to remove: iWork.mdimporter is the Spotlight metadata importer for Pages, Numbers, and Keynote documents. None of those apps exist on this system (/System/Applications/ confirmed: Pages.app, Numbers.app, Keynote.app are absent). No kept binary depends on this importer.
    - iWork.mdimporter
  loctables: []
  frameworks:
    # Safe to remove: StickerFoundation.framework provides low-level sticker data storage for the emoji sticker picker (used by Messages and Stickies, both being removed). Verified via otool -L scan of Finder, Dock, loginwindow, SystemUIServer, ControlCenter: none link StickerFoundation. No kept binary outside the removed feature stack references it.
    - System/Library/Frameworks/StickerFoundation.framework
    # Safe to remove: StickerKit.framework provides the emoji sticker picker UI (used by Messages and Stickies, both being removed). Verified via otool -L scan of Finder, Dock, loginwindow, SystemUIServer, ControlCenter: none link StickerKit. No kept binary outside the removed feature stack references it.
    - System/Library/Frameworks/StickerKit.framework
    # Safe to remove: DVDPlayback.framework provides low-level DVD disc playback. Its only consumer is DVD Player.app (also being removed). Verified via otool -L: Finder, Dock, loginwindow do not link DVDPlayback. The only binary confirmed to hard-link it is /System/Library/CoreServices/Applications/DVD Player.app (also being removed in this feature's coreservices section).
    - System/Library/Frameworks/DVDPlayback.framework
    # Safe to remove: DiscRecordingUI.framework provides the disc-burning confirmation dialog UI. Verified via broad otool scan: the only binary that links DiscRecordingUI is /System/Library/CoreServices/DiscHelper.app, which is the disc burning UI helper — not a boot-critical component. Note: DiscRecording.framework (the public disc I/O API) is NOT listed here and stays on disk; Finder hard-links DiscRecording.framework and that dependency is unaffected by removing only DiscRecordingUI.
    - System/Library/Frameworks/DiscRecordingUI.framework
  kexts: []
  input_methods: []
  services:
    # Safe to remove: ChineseTextConverterService.app is a Services menu item for converting between Traditional and Simplified Chinese text. Verified via otool -L: it only links Foundation, AppKit, and libSystem — all staying on disk. It is a pure UI service app with no MachService or daemon registration; no kept binary depends on it.
    - System/Library/Services/ChineseTextConverterService.app
    # Safe to remove: Summary Service.app is a Services menu item that summarises selected text. It is a pure UI service with no MachService or daemon registration; no kept system binary depends on it.
    #- System/Library/Services/Summary Service.app
    # Safe to remove: Display Calibrator.app is the ColorSync display calibration wizard. Verified via otool -L: it links only Cocoa, IOKit, Carbon, Security, and libSystem — all staying on disk. It has no MachService, LaunchAgent, or LaunchDaemon; it is an on-demand UI tool with no kept binary depending on it.
    - System/Library/ColorSync/Calibrators/Display Calibrator.app
  coreservices:
    # Safe to remove: TipsSpotlightHandler.app handles Spotlight queries that open Tips.app content. Tips.app is being removed. No kept binary depends on this handler.
    - System/Library/CoreServices/TipsSpotlightHandler.app
    # Safe to remove: DVD Player.app is the DVD playback application. DVDPlayback.framework (its sole dependency being removed here) makes it non-functional anyway. This system has no optical drive. No kept binary depends on DVD Player.app.
    - System/Library/CoreServices/Applications/DVD Player.app
    # Safe to remove: Expansion Slot Utility.app shows PCI/Thunderbolt expansion card info. Verified via otool -L: links ExpansionSlotSupport.framework (a private UI-only framework), IOKit, and Security — all non-boot-critical. No LaunchAgent or LaunchDaemon registered; no kept system binary depends on it.
    - System/Library/CoreServices/Applications/Expansion Slot Utility.app
    # Safe to remove: iOS App Installer.app installs .ipa files onto connected iPhones/iPads. Verified via otool -L: links MobileInstallation.framework and AppStoreDaemon.framework — both being removed in app_store_updates. No kept system binary depends on it.
    - System/Library/CoreServices/Applications/iOS App Installer.app
    # Safe to remove: Ticket Viewer.app is the Kerberos ticket management GUI. Verified via otool -L: links GSS.framework and Heimdal.framework (both staying on disk as system Kerberos libraries). It is a pure UI app with no MachService or LaunchAgent; the underlying Kerberos stack (gssd, etc.) is not being removed and is unaffected. No kept binary depends on this app.
    - System/Library/CoreServices/Applications/Ticket Viewer.app
  assets:
    # Safe to remove: com_apple_MobileAsset_DictionaryServices_dictionary3macOS is the macOS dictionary content asset for Dictionary.app (being removed). No kept binary streams from this asset directory.
    - com_apple_MobileAsset_DictionaryServices_dictionary3macOS
    # Safe to remove: com_apple_MobileAsset_VCPMobileAssets is a Video Codec Package asset bundle (confirmed via /System/Library/Video/Plug-Ins/VCPHEVC.bundle). The VCPHEVC bundle itself links only CoreFoundation, CoreMedia, CoreVideo, IOSurface, VideoToolbox, and libSystem — none of which are being removed. The MobileAsset directory does not exist on this system (path not present under /System/Library/AssetsV2/), confirming it has never been downloaded and is not in active use.
    - com_apple_MobileAsset_VCPMobileAssets
  launchagent_plists: []
  launchdaemon_plists: []
  agents:
    # Safe to remove: tipsd is the Tips app analytics and content-update daemon. Verified via plutil -p: triggered by com.apple.coreduetcontext and language-changed notifications; its MachServices are com.apple.tipsd.*. Tips.app is being removed. No kept binary depends on com.apple.tipsd.* MachServices.
    - tipsd
    # Safe to remove: stickersd manages the emoji sticker pack index and recency list. Verified via plutil -p: MachServices are com.apple.stickers.api, com.apple.stickers.recency, com.apple.stickers.launch-state-manager — all consumed exclusively by Messages and Stickies (both being removed). No kept binary references these MachServices.
    - stickersd
    # Safe to remove: voicememod is the VoiceMemos iCloud sync daemon. Verified via plutil -p: binary at /System/iOSSupport/System/Library/PrivateFrameworks/VoiceMemos.framework/Support/voicememod; MachServices are com.apple.voicememod.xpc and com.apple.voicememod.datastore.Cloud. VoiceMemos.app is being removed. No kept binary depends on these XPC endpoints.
    - voicememod
    # Safe to remove: translationd provides on-device translation via Translation.framework. Verified via plutil -p: MachServices are com.apple.translation.text and com.apple.translationd. Verified via otool -L on Finder and Dock: neither links Translation.framework. No kept system binary depends on these MachServices.
    - translationd
    # Safe to remove: helpd serves the macOS Help Viewer content database. Verified via plutil -p: binary at HelpData.framework/Resources/helpd; sole MachService is com.apple.helpd. Verified via otool -L on Finder, Dock, loginwindow, and System Settings: none hard-link HelpData.framework. The Help Viewer UI (Help.app) is not a boot-critical component; disabling helpd causes Help menu items to silently fail but does not affect system boot or core OS operation.
    #- helpd
    # Safe to remove: midiserver is the CoreMIDI server providing MIDI device routing. Verified via plutil -p: LaunchEvent is com.apple.bluetooth.connections (triggered only when a Bluetooth MIDI device connects); MachServices are com.apple.midiserver and com.apple.midiserver.io. Verified via otool -L: Dock and Finder only weak-link libswiftCoreMIDI.dylib (weak flag confirmed), meaning dyld resolves gracefully to NULL if the server is absent. Verified via otool -L on coreaudiod and audiomxd: neither links CoreMIDI. The audio subsystem (coreaudiod/audiomxd — flagged NEVER touch in manifest header) is fully independent of midiserver.
    # - midiserver
    # Safe to remove: printtool.agent is the user-session print job manager. Verified via plutil -p: binary at PrintCore.framework/printtool with PRINTTOOL_MODE=agent; sole MachService is com.apple.printtool.agent. Verified via otool -L on Finder and loginwindow: neither links PrintCore. No kept system binary depends on this agent.
    #- printtool.agent
    # Safe to remove: printuitool.agent is the print dialog UI host. Verified via plutil -p: binary at PrintingPrivate.framework/PrintUITool; sole MachService is com.apple.printuitool.agent. No kept system binary hard-links PrintingPrivate.framework or depends on this MachService.
    #- printuitool.agent
  daemons:
