    # Safe to remove: PRIMLCKPreemptivePing.appex sends preemptive lock-check pings for PRIM telemetry. Verified present at /System/Library/ExtensionKit/Extensions/PRIMLCKPreemptivePing.appex. No kept system binary depends on it.
