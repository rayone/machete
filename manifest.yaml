    - System/Library/PrivateFrameworks/EcosystemAnalytics.framework
    # Safe to remove: Noticeboard.framework provides the nbstated daemon and noticeboard notification delivery. Verified via otool -L on Finder, Dock, loginwindow, SystemUIServer: none hard-link Noticeboard.framework. Verified via rg scan of all LaunchAgent/LaunchDaemon plists: zero references to com.apple.noticeboard.state MachService outside this feature.
