    # Safe to remove: RepackagingWorker.appex handles repackaging/resubmission of telemetry payloads. Verified present at /System/Library/ExtensionKit/Extensions/RepackagingWorker.appex. No kept system binary depends on it.
    - RepackagingWorker.appex
  mdimporters: []
  loctables: []
  frameworks:
