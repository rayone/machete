    # via NSWorkspace URLForApplicationWithBundleIdentifier.
    path: System/Library/PrivateFrameworks/CommerceKit.framework/Versions/A/Resources/storeuid.app/Contents/Info.plist
    action: plist_delete_key
    key: CFBundleVisibleComponentName
    backup: /tmp/_storeuid_info_original.plist

