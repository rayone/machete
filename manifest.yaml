# ==============================================================================
# DEBLOAT MANIFEST — macOS 26.4 / Apple
# ==============================================================================
#
# SCHEMA per feature:
#
#   feature_name:
#     description: Human-readable purpose
#
#     # ---- 1. CORE SYSTEM BUILDING BLOCKS --------------------------------
#     # High risk — removing these can break apps or the OS itself.
#
#     frameworks:   Public + private frameworks (paths from / — deleted from SSV mount)
#                   Shared libraries (APIs) used by apps and the OS.
#                   Location: /System/Library/Frameworks + PrivateFrameworks.
#                   Think of these as macOS's "code toolbox" — critical for
#                   system and app functionality.  RISK: HIGH.
#
#     coreservices: /System/Library/CoreServices/**/*.app or files (full path from /)
#                   Essential system apps and components (Finder, Dock, login
#                   services).  Core OS behaviour lives here — disabling causes
#                   major system instability.  RISK: HIGH.
#
#     kexts:        /System/Library/Extensions/*.kext or *.bundle
#                   Kernel Extensions — low-level hardware drivers (Wi-Fi,
#                   graphics, USB).  Modern macOS is phasing these out in favour
#                   of system extensions.  RISK: HIGH.
#
#     # ---- 2. BACKGROUND SERVICES & SYSTEM PROCESSES ---------------------
#     # Moderate risk — controls what runs automatically; common tuning target.
#
#     launchdaemon_plists: SSV LaunchDaemon plist filenames (label only, no .plist)
#                   Definitions for system-wide background services managed by
#                   launchd.  These run as root regardless of who is logged in.
#
#     launchagent_plists:  SSV LaunchAgent plist filenames (label only, no .plist)
#                   Definitions for user-level background services managed by
#                   launchd.  Run in the user's login session.
#
#     daemons:      launchctl labels to disable in system domain (full label)
#                   Actual system-domain service identifiers used with launchctl.
#                   Disabling stops the service without removing its plist.
#
#     agents:       launchctl labels to disable in gui/$UID domain (suffix after com.apple.)
#                   User-domain service identifiers used with launchctl.
#                   Often targeted for performance tuning or privacy hardening.
#
#     services:     /System/Library/Services/*.app
#                   macOS "Services" menu items (right-click actions).  Provide
#                   quick actions between apps.  Usually safe; minor usability
#                   impact if removed.
#
#     # ---- 3. EXTENSION & PLUGIN SYSTEM ----------------------------------
#     # Moderate risk — plug-in points; disabling affects app features.
#
#     appex:        /System/Library/ExtensionKit/Extensions/*.appex
#                   Sandboxed App Extensions (share sheets, widgets, Settings
#                   panels).  Safe, modern extension mechanism — disabling
#                   affects specific app features but rarely breaks the OS.
#
#     xpc:          Framework-embedded .xpc services (full path from /)
#                   Background helper services using XPC (inter-process
#                   communication).  Apps rely on them for modular tasks —
#                   breaking them can crash the parent app.
#
#     pluginkit:    bundle IDs to suppress with pluginkit -e ignore
#                   Suppresses plugin discovery via PluginKit without deleting
#                   binaries from SSV.  Safer than deletion — used when the
#                   binary must stay on disk (e.g. Spotlight hotkey handlers).
#
#     mdimporters:  /System/Library/Spotlight/*.mdimporter
#                   Spotlight indexing plugins.  Allow specific file types to
#                   be searchable — removing means those files won't appear in
#                   Spotlight results.
#
#     # ---- 4. APP STRUCTURE & EMBEDDED COMPONENTS ------------------------
#
#     apps:         SSV paths under /System/Applications/ (or full path from /)
#                   Top-level application bundles on the SSV.
#
#     helpers:      Framework-embedded .app helpers (full path from /)
#                   Embedded mini-apps inside frameworks or other apps.  Handle
#                   background tasks (updates, rendering, etc.) — common in
#                   browsers and media apps.
#
#     # ---- 5. USER INTERFACE & SYSTEM UX ---------------------------------
#
#     prefpanes:    /System/Library/PreferencePanes/*.prefPane
#                   System Settings panels.  Removing hides configuration UI
#                   but does not disable the underlying feature.
#
#     menu_extras:  /System/Library/CoreServices/Menu\ Extras/*.menu
#                   Menu bar icons (Wi-Fi, battery, clock, etc.).  Core user
#                   interaction elements — removing hides the icon.
#
#     loctables:    ControlCenter .loctable filenames (relative to ControlCenter.app/Contents/Resources/)
#                   Localization files (UI string translations).  Affect
#                   language display only — safe to remove for unused locales.
#
#     input_methods: /System/Library/Input\ Methods/*.app
#                   Keyboard/input systems for different languages and scripts.
#                   Required for typing in the associated language.
#
#     # ---- 6. ASSETS & RESOURCES -----------------------------------------
#
#     assets:       /System/Library/AssetsV2/* directories
#                   System-downloaded resources such as ML models, TTS voices,
#                   and dictation assets.  Used by features like Siri and
#                   dictation — safe to remove if the feature is also removed.
#
#     # ---- 7. USER-SPECIFIC DATA (safer to modify) -----------------------
#
#     user_containers:    ~/Library/Containers/* bundle IDs
#                   Sandboxed app data directories.  Deleting resets the app
#                   to a first-run state but does not break the OS.
#
#     user_group_containers: ~/Library/Group\ Containers/* group IDs
#                   Shared data containers used by apps from the same developer
#                   (e.g. syncing data across an app suite).
#
#     user_prefs:   ~/Library/Preferences/*.plist filenames (label only)
#                   App and system preference files.  Safe to delete — the app
#                   recreates them with defaults on next launch.
#
#     user_caches:  ~/Library/Caches/* directory names
#                   Temporary/cached files.  Safe to clear — improves disk
#                   space and sometimes performance.
#
#     # ---- 8. PATCHES ----------------------------------------------------
#
#     patches:      SSV in-place plist/binary patches (handled separately by executor)
#
# DEPENDENCY EVIDENCE (otool -L on kept binaries + launchctl procinfo):
#   Finder links: TimeMachine.framework, CloudDocs.framework, Contacts.framework,
#                 iCloudQuota.framework, SidecarUI.framework — frameworks stay on
#                 disk; only the backing .app / daemon / agent is removed.
#   ControlCenter links: IMCore.framework, FamilyControls.framework, SiriUI.framework,
#                 SocialLayer.framework — same rule.
#   loginwindow links: FindMyDevice.framework, FindMyMac.framework — frameworks stay.
#   Dock links: AssistantServices.framework, GenerativeModels.framework — frameworks stay.
#   cloudpaird (audioaccessoryd) advertises com.apple.BTServer.cloudpairing —
#               NEVER disable; it is the BT audio pairing XPC service.
#   DictationIM is independent of Siri (separate SpeechRecognitionCore path) — KEPT.
#   corespeechd user agent: voice-trigger / Hey Siri — safe to disable.
#   PerfPowerServicesExtended / PerfPowerServices: Battery pane depends on these — NEVER disable.
#   coreaudiod / audiomxd / AirPlayXPCHelper / bluetoothaudiod / audioanalyticsd:
#               disabling any causes audiomxd 80% CPU spin — NEVER touch.
#   AppleCentauriAlpha/Beta/Control + centaurid: Studio Display driver extensions — NEVER disable.
#   triald / triald.system: A/B feature flag daemon — KEEP (ReportCrash weak-link, prevents bad config lockout).
#   SubmitDiagInfo: Diagnostic relay dependency — KEEP (osanalyticshelper requires for log relay).
#   microstackshot: Instruments/Activity Monitor dependency — KEEP for performance diagnostics.
# ==============================================================================

# ------------------------------------------------------------------------------
# SIRI & APPLE INTELLIGENCE
# otool evidence: Dock links AssistantServices.framework + GenerativeModels.framework
#   but only as lazy/weak — safe to remove backing binaries; framework dylibs stay.
# ------------------------------------------------------------------------------
siri_and_intelligence:
  description: Siri assistant, Apple Intelligence, on-device ML inference stack
  apps:
    - System/Applications/Siri.app
  helpers:
    # SpeechDataInstallerd.app handles speech data installation; SpeechRecognitionServer.app provides recognition services.
    # Removing them while keeping the framework creates broken functionality.
    # - System/Library/PrivateFrameworks/SpeechObjects.framework/Versions/A/SpeechDataInstallerd.app
    # - System/Library/PrivateFrameworks/SpeechObjects.framework/Versions/A/SpeechRecognitionServer.app
  xpc: []
  prefpanes:
    #- Speech.prefPane
  appex:
    - SiriPreferenceExtension.appex
    - SiriAutoEvalPlugin.appex
    - SiriCoreMetricsWorker.appex
    - SiriInferenceRuntimeDiagnostics.appex
    - SiriMASPFLPush.appex
    - SiriNotificationsAppIntentsExtension.appex
    - SiriSuggestionsLightHousePlugin.appex
    - SiriTurnRestatementExtension.appex
    - SiriUploadWorker.appex
    - SiriUserSegmentation.appex
    - SiriVideoAppIntents.appex
    - AssistantSettingsControlsExtension.appex
    - BlackPowderInferenceExtension.appex
    - PrivateMLClientInferenceProviderService.appex
    - TGOnDeviceInferenceProviderService.appex
    - VisualGenerationInference.appex
    - FedAutoEvalPlugin.appex
    - FedStatsMLHostPlugin.appex
    - FedStatsMLHostPluginClassA.appex
    - FedStatsMLHostPluginClassB.appex
    - PrivateEvolutionPlugin.appex
    - ZeoliteEvalExtension.appex
    - CoreMotionFoundationModelExtension.appex
    - AppleIntelligenceReportingSELFIngestor.appex
    # - ODDIExperimentationExtension.appex
    # - ODDIMetricsExtension.appex
    # - ODDIPoirotExperimentationExtension.appex
    # - ODDIPoirotMetricsExtension.appex
    # - PCCAgentClientExtension.appex
    # - SearchToolDiagnosticExtension.appex
    # - SearchToolExtension.appex
    # - SearchUploadWorker.appex
    # - SpeakerIdSamplingExtension.appex
  mdimporters: []
  loctables: []
  frameworks:
    - System/Library/PrivateFrameworks/AssistantSettingsFoundation.framework
    #- System/Library/PrivateFrameworks/CoreSpeech.framework
    - System/Library/PrivateFrameworks/SiriTTSTraining.framework
    # CRITICAL: SpeechObjects.framework is required by Setup Assistant (/System/Library/CoreServices/Setup Assistant.app).
    # Verified via: otool -L showed non-weak linkage to SpeechObjects.framework and DictationServices.framework.
    # Removal breaks device setup/restore flows and initial configuration wizard.
    # - System/Library/PrivateFrameworks/SpeechObjects.framework
    - System/Library/PrivateFrameworks/GenerativeExperiencesRuntime.framework
    # - System/Library/PrivateFrameworks/PrivateCloudCompute.framework
    - System/Library/PrivateFrameworks/ContinuousDialogManagerService.framework
    # CRITICAL: Speech.framework contains localspeechrecognition.xpc used by system dictation.
    # Verified via: ls /System/Library/Frameworks/Speech.framework/Versions/A/XPCServices/localspeechrecognition.xpc
    # While primarily Siri-related, it provides on-device speech recognition that other apps may call.
    # Removal may break dictation functionality in apps that use Speech framework APIs.
    # - System/Library/Frameworks/Speech.framework
    - System/Library/Frameworks/FoundationModels.framework
  kexts: []
  input_methods: []
  coreservices:
    - System/Library/CoreServices/Siri.app
    - System/Library/CoreServices/Siri.bundle
  assets:
    - com_apple_MobileAsset_UAF_FM_GenerativeModels
    - com_apple_MobileAsset_UAF_FM_Visual
    - com_apple_MobileAsset_UAF_FM_Overrides
    - com_apple_MobileAsset_UAF_Siri_Understanding
    - com_apple_MobileAsset_UAF_Siri_TextToSpeech
    - com_apple_MobileAsset_UAF_Siri_PlatformAssets
    - com_apple_MobileAsset_UAF_Siri_UnderstandingASRHammer
    - com_apple_MobileAsset_UAF_Handwriting_Synthesis
    - com_apple_MobileAsset_UAF_SummarizationKitConfiguration
    - com_apple_MobileAsset_UAF_TKModelMessages
    - com_apple_MobileAsset_UAF_Speech_AutomaticSpeechRecognition
    - com_apple_MobileAsset_IntelligentRouting
    - com_apple_MobileAsset_MacinTalkVoiceAssets
    - com_apple_MobileAsset_VoiceServices_CombinedVocalizerVoices
    - com_apple_MobileAsset_VoiceServices_CustomVoice
    - PreinstalledAssetsV2/RequiredByOs/com_apple_MobileAsset_VoiceTriggerAssetsASMac
    - PreinstalledAssetsV2/RequiredByOs/com_apple_MobileAsset_VoiceTriggerAssets
    - PreinstalledAssetsV2/RequiredByOs/com_apple_MobileAsset_VoiceTriggerAssetsStudioDisplay
    - PreinstalledAssetsV2/RequiredByOs/com_apple_MobileAsset_VoiceTriggerAssetsMac
    - PreinstalledAssetsV2/RequiredByOs/com_apple_MobileAsset_SpeakerRecognitionASMacAssets
  launchagent_plists:
    - com.apple.Siri.agent
    #- com.apple.duetexpertd
  launchdaemon_plists: []
  agents:
    - assistantd
    - Siri.agent
    - siriknowledged
    - siriinferenced
    - sirittsd
    - siriactionsd
    - assistant_cdmd
    - assistant_service
    - SiriTTSTrainingAgent
    #- parsec-fbf
    #- parsecd
    #- corespeechd
    - intelligenceplatformd
    - intelligenceflowd
    - intelligencetasksd
    - intelligencecontextd
    - generativeexperiencesd
    - textunderstandingd
    - voicebankingd
    - privatecloudcomputed
    - ModelCatalogAgent
    # - mlhostd
    # - mlruntimed
    #- duetexpertd
  daemons:
    #- com.apple.corespeechd.system
    - com.apple.modelcatalogd
    # Removing it here while keeping in background_intelligence creates inconsistent state.
    # Verified via: plutil -p /System/Library/LaunchDaemons/com.apple.modelmanagerd.plist
    - com.apple.modelmanagerd
    - com.apple.assetsubscriptiond
  pluginkit:
    # Suppress Siri/AI Settings panel and AI inference extensions via pluginkit only
    # (not SSV delete — SiriAttentionAndInvocationExtension handles Cmd+Space Spotlight)
    - com.apple.Siri-Settings.extension
    - com.apple.siri.OnDeviceAnalytics.SiriAttentionAndInvocationExtension
    - com.apple.siri.OnDeviceAnalytics.SpeakerIdSamplingExtension
    - com.apple.siri.SiriPrivateLearningAnalytics.SiriUserSegmentation
    - com.apple.siri.SiriSuggestionsLightHousePlugin
    - com.apple.siri.OnDeviceAnalytics.ODDIExperimentationExtension
    - com.apple.siri.OnDeviceAnalytics.ODDIMetricsExtension
    - com.apple.siri.metrics.ExperimentationExtension
    - com.apple.siri.metrics.MetricsExtension
    - com.apple.siri.AssistantSettingsControls
  user_containers:
    - com.apple.Siri
    - com.apple.siri.parsec
  user_group_containers:
    # Safe to remove: group.com.apple.CoreSpeech is the CoreSpeech shared group container (CoreSpeech.framework backing services removed).
    - group.com.apple.CoreSpeech
    # Safe to remove: group.com.apple.SiriTTS is the Siri TTS shared group container (sirittsd and SiriTTSTrainingAgent removed).
    - group.com.apple.SiriTTS
    # Safe to remove: group.com.apple.siri.ASR.shared is the Siri ASR shared group container.
    - group.com.apple.siri.ASR.shared
    # Safe to remove: group.com.apple.siri.GMSSELFIngestor is the Siri GMS self-ingestor shared container (appex removed).
    - group.com.apple.siri.GMSSELFIngestor
    # Safe to remove: group.com.apple.siri.referenceResolution is the Siri reference resolution shared container.
    - group.com.apple.siri.referenceResolution
    # Safe to remove: group.com.apple.siri.sirisuggestions is the Siri suggestions shared container (suggestd removed).
    - group.com.apple.siri.sirisuggestions
    # Safe to remove: group.com.apple.PegasusConfiguration is the parsecd/parsec Siri bag config shared container (com.apple.siri.parsec user_container removed).
    - group.com.apple.PegasusConfiguration
  user_prefs:
    - com.apple.Siri
    - com.apple.assistant.backedup
    - com.apple.assistant.support
  user_caches:
    - com.apple.Siri

# ------------------------------------------------------------------------------
# ICLOUD (Drive, Photos, Keychain Sync, iCloud+, Account)
# otool evidence: Finder links CloudDocs.framework, iCloudQuota.framework,
#   iCloudQuotaUI.framework, AOSAccounts.framework — frameworks stay on disk.
# ------------------------------------------------------------------------------
icloud:
  description: iCloud Drive sync, Photos sync, Keychain sync, iCloud account
  apps: []
  helpers:
    # Safe to remove: iCloud Drive.app is the menubar helper embedded in iCloudDriveCore.framework. Verified via otool -L Finder: Finder links CloudDocs.framework (not in removal list), not iCloudDriveCore. No other kept binary links iCloudDriveCore.framework.
    - System/Library/PrivateFrameworks/iCloudDriveCore.framework/Versions/A/Resources/iCloud Drive.app
  xpc: []
  prefpanes:
    # Safe to remove: AppleIDPrefPane is the System Settings UI pane for Apple ID sign-in. All features consuming Apple ID (iCloud, App Store, Messages, FaceTime, Find My) are removed in this manifest. Local user login does not require Apple ID.
    - AppleIDPrefPane.prefPane
    # Safe to remove: InternetAccounts.prefPane is the UI settings pane for Mail/Calendar/Contacts account configuration. All dependent apps (Mail, Calendar, Contacts) are removed in this manifest.
    - InternetAccounts.prefPane
  appex:
    # Safe to remove: AppleIDSettings.appex is the Settings UI extension for Apple ID. Only invoked when AppleIDPrefPane is present, which is also being removed.
    - AppleIDSettings.appex
    # Safe to remove: InternetAccountsSettingsExtension.appex is the Settings UI extension for internet account management. All account-consuming apps (Mail, Calendar, Contacts) are removed in this manifest.
    - InternetAccountsSettingsExtension.appex
    # Safe to remove: FollowUpSettingsExtension.appex is also listed in the follow_up feature (line 1842). It is a Settings UI extension for CoreFollowUp iCloud notifications. No kept binary depends on this extension.
    - FollowUpSettingsExtension.appex
    # Safe to remove: CloudWorker.appex is an ExtensionKit background worker for CloudKit tasks. Verified present at /System/Library/ExtensionKit/Extensions/CloudWorker.appex. No kept system binary depends on it.
    - CloudWorker.appex
    # Safe to remove: BiomeSELFIngestor.appex is also listed in the telemetry feature (line 1228). It is a Biome data upload worker for iCloud analytics. No kept binary requires it.
    - BiomeSELFIngestor.appex
    # Safe to remove: AccountsUISettingsAppIntents.appex is a Settings App Intents extension for the accounts UI. Verified at /System/Library/ExtensionKit/Extensions/AccountsUISettingsAppIntents.appex. No kept binary depends on it.
    - AccountsUISettingsAppIntents.appex
  mdimporters: []
  loctables: []
  frameworks:
    # Safe to remove: CloudKitDaemon.framework contains cloudd and ckdiscretionaryd, both being disabled. Verified via otool -L on the cloudd binary: only links public CloudKit.framework (stays) and CloudAssetsDaemon.framework. No kept binary links CloudKitDaemon.framework.
    - System/Library/PrivateFrameworks/CloudKitDaemon.framework
    # Safe to remove: CloudKitCode.framework is the internal RPC implementation layer for CloudKit used exclusively by cloudd (being removed). No kept binary was found linking this framework.
    - System/Library/PrivateFrameworks/CloudKitCode.framework
    # Safe to remove: CloudKitCodeProtobuf.framework is the protobuf serialization layer for CloudKitCode, used exclusively within the cloudd stack. No kept binary links it.
    - System/Library/PrivateFrameworks/CloudKitCodeProtobuf.framework
    # Safe to remove: CloudKitDistributedSync.framework supports collaborative document syncing. All apps using it (Notes, etc.) are removed in this manifest. No kept binary links it.
    - System/Library/PrivateFrameworks/CloudKitDistributedSync.framework
    # Safe to remove: iCloudDriveCore.framework hosts the bird daemon binary. Verified via otool: Finder links CloudDocs.framework (stays), not iCloudDriveCore. No other kept binary links iCloudDriveCore.
    - System/Library/PrivateFrameworks/iCloudDriveCore.framework
    # Safe to remove: AOSAccountsLite.framework is the lightweight iCloud account bootstrap layer, distinct from AOSAccounts.framework (stays — Finder hard-links it). Verified: separate framework directories confirmed via ls.
    - System/Library/PrivateFrameworks/AOSAccountsLite.framework
    # Safe to remove: AppleAccountUI.framework is the UI-only component for Apple ID sign-in sheets. The backing daemon (appleaccountd) does not link this framework. No kept binary links AppleAccountUI.
    - System/Library/PrivateFrameworks/AppleAccountUI.framework
    # Not very Safe to remove: AuthKit.framework provides Apple ID token/auth primitives. Verified via otool -L /usr/libexec/secd: secd weak-links it (weak flag present in load command), meaning secd handles its absence gracefully and local Keychain remains fully functional. No other kept critical binary hard-links AuthKit.
    #- System/Library/PrivateFrameworks/AuthKit.framework
    # Safe to remove: AuthKitUI.framework is the UI layer for AuthKit authentication dialogs. No kept binary was found linking it via otool scan.
    - System/Library/PrivateFrameworks/AuthKitUI.framework
    # Safe to remove: CoreCDP.framework implements the iCloud Keychain circle-of-trust. Verified via otool -L /usr/libexec/secd: secd weak-links it (weak flag present), so local Keychain continues to function without iCloud sync. cdpd (the only daemon using it directly) is being removed.
    - System/Library/PrivateFrameworks/CoreCDP.framework
    # Safe to remove: ProtectedCloudStorage.framework hosts ProtectedCloudKeySyncing, which syncs iCloud Keychain escrow keys. Its sole agent (protectedcloudstorage.protectedcloudkeysyncing) is being removed. Verified via plutil -p: only MachServices are iCloud-specific alloy channels.
    - System/Library/PrivateFrameworks/ProtectedCloudStorage.framework
  kexts: []
  input_methods: []
  coreservices:
    # Safe to remove: iCloud.app is the CoreServices iCloud account status menu app. Verified: exists at /System/Library/CoreServices/iCloud.app. No kept system binary depends on it.
    - System/Library/CoreServices/iCloud.app
    # Safe to remove: iCloud+.app is the CoreServices iCloud+ subscription management app. Verified: exists at /System/Library/CoreServices/iCloud+.app. No kept system binary depends on it.
    - System/Library/CoreServices/iCloud+.app
  assets: []
  launchagent_plists: []
  launchdaemon_plists: []
  agents:
    # Safe to remove: cloudd (user agent) is the user-session CloudKit daemon. Verified via plutil -p: MachServices are com.apple.cloudd (user) and com.apple.bird.push — both iCloud-specific. No kept non-iCloud agent depends on these endpoints.
    - cloudd
    # Safe to remove: cloudphotod syncs the Photos library to iCloud. Also listed in the photos feature. Verified via plutil -p: all MachServices (com.apple.cloudphotod.*) are iCloud Photos-specific.
    - cloudphotod
    # Safe to remove: iCloudNotificationAgent manages iCloud push notification delivery. Verified via plutil -p: binary at iCloudNotification.framework/iCloudNotificationAgent; MachServices are com.apple.ind.xpc and com.apple.ind.aps — iCloud Notification Daemon only.
    - iCloudNotificationAgent
    # Safe to remove: icloudmailagent handles iCloud Mail push credentials. Verified via plutil -p: triggered only on AppleAccount add/delete events; MachServices are com.apple.aps.icloud.mcc and com.apple.icloudmailagent.secret.xpc. Mail is being removed in this manifest.
    - icloudmailagent
    # Safe to remove: findmydevice-user-agent is the user-session helper for Find My Device. Also covered in the find_my feature. Verified via plutil -p: sole MachService is com.apple.icloud.findmydeviced.findmydevice-user-agent.
    - icloud.findmydeviced.findmydevice-user-agent
    # Safe to remove: bird is the iCloud Drive sync daemon. Verified via plutil -p: binary at iCloudDriveCore.framework/Support/bird; MachServices are com.apple.bird.* (iCloud Drive-specific). Finder links CloudDocs.framework (stays), not bird.
    - bird
    # Safe to remove: itunescloudd manages iTunes/Apple Music cloud library sync. Verified via plutil -p: binary at iTunesCloud.framework/Support/itunescloudd. Music and TV apps are removed in this manifest.
    - itunescloudd
    # Safe to remove: syncdefaultsd is the iCloud Key-Value Store daemon (NSUbiquitousKeyValueStore). Verified via plutil -p: MachServices are com.apple.kvsd and com.apple.aps.kvsd. Grep of all LaunchAgent/LaunchDaemon plists found zero references to com.apple.kvsd outside syncdefaultsd's own plist.
    - syncdefaultsd
    # Safe to remove: cmfsyncagent syncs the Communications Message Filter (iMessage spam filter) via iCloud KVS. Verified via otool -L on CMFSyncAgent binary: links IMFoundation.framework and CommunicationsFilter.framework — both from features being removed. No kept binary uses com.apple.cmfsyncagent.auth.
    - cmfsyncagent
    # Safe to remove: cloudsettingssyncagent (binary: /System/Library/CoreServices/CloudSettingsSyncAgent) syncs System Preferences to iCloud KVS. Verified via plutil -p /System/Library/LaunchAgents/com.apple.CloudSettingsSyncAgent.plist: all LaunchEvents are com.apple.kvs.store-did-change.* notifications. With syncdefaultsd (KVS daemon) also removed, this agent performs no useful work.
    - cloudsettingssyncagent
    # Safe to remove: icloud.searchpartyuseragent is the user-session Find My network beaconing agent. Also listed in the find_my feature. Verified via plutil -p: all MachServices are searchparty/findmy-specific alloy channels.
    - icloud.searchpartyuseragent
    # Safe to remove: icloudwebd handles iCloud web push notifications. Verified via plutil -p: binary at /usr/libexec/icloudwebd; MachServices are com.apple.icloudwebd and com.apple.private.alloy.icloudweb-idswake — iCloud web-only.
    - icloudwebd
    # Safe to remove: iCloudUserNotifications displays iCloud account alert notifications. Verified via plutil -p: binary inside AOSAccounts.framework (framework stays on disk; only the daemon is disabled); MachService is com.apple.icloudusernotification.agent — iCloud-specific.
    - iCloudUserNotifications
    # Safe to remove: ckdiscretionaryd is the CloudKit discretionary sync scheduler. Verified via plutil -p: binary at CloudKitDaemon.framework/Support/ckdiscretionaryd; sole MachService is com.apple.ckdiscretionaryd. CloudKitDaemon.framework is being removed.
    - ckdiscretionaryd
    # Safe to remove: SecureBackupDaemon (com.apple.sbd) backs up iCloud Keychain escrow records. Verified via plutil -p: binary at CloudServices.framework/Helpers/com.apple.sbd. CloudServices.framework stays on disk (secd hard-links it); secd only posts com.apple.security.itembackup to trigger sbd — with sbd disabled secd continues operating and local Keychain is unaffected.
    - SecureBackupDaemon
    # Safe to remove: EscrowSecurityAlert displays UI alerts when iCloud Keychain escrow changes. Verified via plutil -p: triggered only by com.apple.EscrowSecurityAlert.* Darwin notifications, which are only posted by SecureBackupDaemon (being removed).
    - EscrowSecurityAlert
    # Safe to remove: AOSHeartbeat sends periodic Apple Online Services heartbeat pings. Verified via plutil -p: binary in AOSKit.framework/Helpers/AOSHeartbeat.app; no MachServices registered; triggered only by daily XPC activity. No kept system binary depends on it.
    - AOSHeartbeat
    # Safe to remove: AOSPushRelay relays Apple Push Notifications for AOS/iCloud account services. Verified via plutil -p: binary in AOSKit.framework/Helpers/AOSPushRelay.app; MachServices are com.apple.AOSPushRelay.* — AOS account-specific. The core APNs daemon (apsd) does not reference AOSPushRelay; verified via plutil -p /System/Library/LaunchDaemons/com.apple.apsd.plist showing no cross-reference.
    - AOSPushRelay
    # Safe to remove: appleaccountd manages Apple ID account identity XPC services. Verified via plutil -p: MachServices are com.apple.aa.*. All consumers (App Store, Messages, FaceTime, iCloud) are removed in this manifest. Grep of all LaunchAgent/LaunchDaemon plists found zero references to com.apple.aa.daemon.xpc outside appleaccountd's own plist.
    - appleaccountd
    # Safe to remove: appleidsetupd handles Apple ID setup and repair during OS onboarding. Verified via plutil -p: triggered only by MDM device-posture changes; MachServices are com.apple.appleidsetup.xpc and repair variants. MDM (enterprise feature) is also removed in this manifest.
    - appleidsetupd
    # Safe to remove: akd is the AuthKit daemon providing Apple ID token, anisette, and Sign in with Apple XPC services. Verified via plutil -p: MachServices are com.apple.ak.auth.xpc, com.apple.ak.anisette.xpc, etc. All consumers (App Store, iCloud, Messages) are removed. Grep of all LaunchAgent/LaunchDaemon plists found zero references to com.apple.ak.* MachServices outside akd's own plist.
    - akd
    # Safe to remove: cdpd is the CoreCDP daemon managing the iCloud Keychain circle-of-trust state machine. Verified via plutil -p: sole MachService is com.apple.cdp.daemon. With CoreCDP.framework removed, secd's weak link resolves to NULL and local Keychain remains fully operational.
    - cdpd
    # Safe to remove: coreidvd provides Apple ID web-presentment (WebAuthn/passkey) XPC for iCloud. Verified via plutil -p: MachService is com.apple.coreidvd.web-presentment.xpc; otool -L shows it links CoreIDV/CoreIDCred frameworks and CloudKit.framework. No kept binary depends on this XPC endpoint.
    - coreidvd
    # Safe to remove: protectedcloudstorage.protectedcloudkeysyncing rolls and syncs iCloud Keychain escrow keys. Verified via plutil -p: binary at ProtectedCloudStorage.framework/Helpers/ProtectedCloudKeySyncing; MachServices are iCloud-specific alloy PCS channels. ProtectedCloudStorage.framework is being removed.
    - protectedcloudstorage.protectedcloudkeysyncing
    # Safe to remove: FeatureAccessAgent manages iCloud+ feature entitlement checks. Verified via plutil -p: binary at CloudSubscriptionFeatures.framework/FeatureAccessAgent; sole MachService is com.apple.ind.cloudfeatures. No kept system binary depends on iCloud+ feature gating.
    - FeatureAccessAgent
  daemons:
    # Safe to remove: com.apple.cloudd is the system-level CloudKit daemon. Verified via plutil -p: binary at CloudKitDaemon.framework/Support/cloudd --system; MachServices are com.apple.cloudd.system and com.apple.cloudasset.cloudd.system. CloudKitDaemon.framework is being removed. No kept system daemon references these MachServices.
    - com.apple.cloudd
    # Safe to remove: com.apple.icloud.searchpartyd is the system-level Find My network search daemon. Also listed in the find_my feature. Verified via plutil -p: binary at /usr/libexec/searchpartyd; all MachServices are searchparty/findmy-specific.
    - com.apple.icloud.searchpartyd
    # Safe to remove: com.apple.icloud.findmydeviced is the system-level Find My Device daemon. Also listed in the find_my feature. Verified via plutil -p: binary at /usr/libexec/findmydeviced; all MachServices are findmydeviced-specific.
    - com.apple.icloud.findmydeviced
    # Safe to remove: com.apple.adid is the Advertising ID daemon for iCloud/Apple services ad attribution. Verified via plutil -p: binary at CoreADI.framework/adid, runs as _fpsd user; sole MachService is com.apple.adid. No kept non-advertising system binary depends on it.
    - com.apple.adid
  pluginkit:
    - com.apple.Internet-Accounts-Settings.extension
    - com.apple.Passwords-Settings.extension
    - com.apple.systempreferences.AppleIDSettings
    - com.apple.AccountsUISettings.AppIntents
  user_containers:
    # Safe to remove: com.apple.bird is the iCloud Drive sandbox container for the bird daemon (being removed).
    - com.apple.bird
    # Safe to remove: com.apple.CloudDocs.container-encryptionkeys holds iCloud Drive file encryption keys. Only accessed by bird (being removed).
    - com.apple.CloudDocs.container-encryptionkeys
    # Safe to remove: com.apple.icloud.remoteui is the sandbox container for the iCloud remote UI helper (being removed).
    - com.apple.icloud.remoteui
  user_group_containers:
    # Safe to remove: group.com.apple.clouddocs is the shared group container for iCloud Documents sync. Only populated by bird and iCloud Drive (both being removed).
    - group.com.apple.clouddocs
    # Safe to remove: com.apple.bird is the iCloud Drive per-user group container. bird daemon is being removed.
    - com.apple.bird
    # Safe to remove: group.com.apple.iCloudDrive is the iCloud Drive shared data container. Only populated by bird (being removed).
    - group.com.apple.iCloudDrive
    # Safe to remove: group.com.apple.icloud.searchpartyuseragent is the Find My / Search Party user agent shared container. Both icloud.searchpartyuseragent and icloud.searchpartyd are being removed.
    - group.com.apple.icloud.searchpartyuseragent
    # Safe to remove: group.com.apple.FileProvider.DomainCaching caches iCloud Drive FileProvider domain metadata. iCloudDriveCore.framework (being removed) is its sole writer.
    - group.com.apple.FileProvider.DomainCaching
  user_prefs:
    # Safe to remove: com.apple.icloud.fmfd is the Find My Device daemon preference file. Its daemon is being removed.
    - com.apple.icloud.fmfd
    # Safe to remove: MobileMeAccounts stores the iCloud account configuration (Apple ID, tokens). With appleaccountd and akd removed, this file is unused.
    - MobileMeAccounts
    # Safe to remove: com.apple.cloudkit.sharedd stores CloudKit sharing daemon preferences. Its daemon (cloudd) is being removed.
    - com.apple.cloudkit.sharedd
  user_caches:
    # Safe to remove: com.apple.bird is the iCloud Drive cache directory for the bird daemon (being removed).
    - com.apple.bird

