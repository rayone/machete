    # Safe to remove: PnROnDeviceWorker.appex is the Ping-and-Reply on-device telemetry worker. Verified present at /System/Library/ExtensionKit/Extensions/PnROnDeviceWorker.appex. No kept system binary depends on it.
    - PnROnDeviceWorker.appex
    # Safe to remove: PnRCarPlayOnDeviceWorker.appex is the CarPlay variant of the Ping-and-Reply telemetry worker. Verified present at /System/Library/ExtensionKit/Extensions/PnRCarPlayOnDeviceWorker.appex. No kept system binary depends on it.
